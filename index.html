<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Persona Nexus - 聊天室</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="chat-container">
      <!-- 角色信息區 -->
      <div class="chat-header">
        <div class="character-info">
          <div class="character-avatar"></div>
          <div class="character-details">
            <h2 id="characterName">聊天對象</h2>
            <p id="characterStatus" class="status">離線</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="protagonistBtn" class="icon-btn" title="主人公人設">⚙</button>
          <button id="restartBtn" class="icon-btn" title="重啟聊天室">🔄</button>
          <button id="homeBtn" class="icon-btn" title="返回首頁">⌂</button>
        </div>
      </div>

      <!-- 聊天訊息區 -->
      <div class="messages-container">
        <div id="messagesList" class="messages-list">
          <!-- 訊息動態插入 -->
        </div>
      </div>

      <!-- 訊息輸入區 -->
      <div class="chat-input-area">
        <textarea
          id="messageInput"
          class="message-input"
          placeholder="輸入訊息... (Shift+Enter 換行，Enter 發送)"
          rows="3"
        ></textarea>
        <button id="sendBtn" class="send-btn">發送</button>
      </div>
    </div>

    <!-- 🆕 主人公人設彈窗 -->
    <div id="protagonistModal" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-header">
          <h3>主人公人設</h3>
          <button id="protagonistCloseBtn" class="modal-close-btn" title="關閉">✕</button>
        </div>
        <div class="modal-body">
          <label class="modal-label" for="protagonistNameInput">名稱</label>
          <input
            id="protagonistNameInput"
            class="modal-input"
            type="text"
            placeholder="主人公的名稱"
            maxlength="50"
          />
          <label class="modal-label" for="protagonistBackgroundInput">背景</label>
          <textarea
            id="protagonistBackgroundInput"
            class="modal-textarea"
            placeholder="主人公的背景設定（身份、經歷、與角色的關係等）"
            rows="8"
            maxlength="2500"
          ></textarea>
        </div>
        <div class="modal-footer">
          <button id="protagonistSaveBtn" class="modal-save-btn">儲存</button>
        </div>
      </div>
    </div>

    <!-- 🆕 聊天室準備中的懸浮層 -->
    <div id="initializingOverlay" class="initializing-overlay">
      <div class="initializing-content">
        <div class="loading-spinner"></div>
        <p id="initializingMessage">聊天室準備中...</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
